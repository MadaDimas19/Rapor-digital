<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">

<title>Rapor Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=block">
<style>
:root{--bg:#f0f8f3;--cd:#fff;--tx:#14301f;--mu:#5d7a68;--pr:#12894a;--pr2:#0b6b3a;--pt:#fff;--bd:#d3e8db;--ac:#e2f4e9;--rd:#c0392b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
label.f{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px}
textarea{min-height:70px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;min-height:44px;background:var(--ac);color:var(--pr);font-weight:600;cursor:pointer}
button.p{background:var(--pr);color:var(--pt)}button.d{color:var(--rd)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;position:sticky;top:0;background:var(--bg);z-index:2}
.chip{flex:none;min-height:38px;padding:6px 12px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);font-weight:500}
.chip.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row .no{width:26px;color:var(--mu);font-size:13px;text-align:right;flex:none}
.row .nm{flex:1;font-size:14px;min-width:0}
.row input{width:76px;text-align:center;flex:none;font-size:18px;padding:6px}
.row.a input{width:56px}
.sub{font-size:13px;color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;min-height:48px}
nav button b{font-size:20px;line-height:1}nav button.on{color:var(--pr)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.ov>div{max-width:720px;margin:0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.tg.s{opacity:.92}
.ck{display:flex;gap:10px;align-items:center;padding:6px 0}.ck input{width:22px;min-height:22px;height:22px}

.hd{background:linear-gradient(135deg,#0b6b3a,#1aa55d);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:0 0 24px 24px;box-shadow:0 4px 16px rgba(11,107,58,.25)}
.hd img{width:44px;height:44px;background:#fff;border-radius:50%;padding:3px;flex:none}
.hd b{display:block;font-size:19px;letter-spacing:.2px}.hd span{font-size:12.5px;opacity:.92}
main{padding-top:14px}
.cd{border-radius:16px;box-shadow:0 2px 10px rgba(18,137,74,.08)}
h1{color:var(--pr2)}
button{border-radius:12px}
button.p,.chip.on{background:linear-gradient(135deg,#12894a,#22b46b);color:#fff;border-color:transparent}
button.p{box-shadow:0 2px 8px rgba(18,137,74,.28)}
.chip{border-radius:20px;color:var(--pr2)}
input,select,textarea{background:#f7fcf9;border-radius:12px}
input:focus,select:focus,textarea:focus{outline:2px solid #22b46b;border-color:#22b46b;background:#fff}
nav{border-top:3px solid var(--pr);box-shadow:0 -4px 14px rgba(0,0,0,.07)}
nav button.on{color:var(--pr2);background:var(--ac);border-radius:14px}
.fd{background:#fff;color:var(--tx);border:1px solid var(--bd);border-left:5px solid var(--pr)}
.fd b{color:var(--pr2)}
.row .no{color:var(--pr)}
.tg{background:#0b6b3a;color:#fff}
.tb th{background:var(--ac);color:var(--pr2)}
summary{cursor:pointer}
/* ===== LEMBAR CETAK (kertas A4, tidak ikut tema) ===== */
#sheets{display:none;padding:4px 0 20px;text-align:center}
body[data-tab=cetak] #sheets{display:block}
.page{width:210mm;height:297mm;position:relative;background:#fff;color:#000;overflow:hidden;margin:0 auto 12px;box-shadow:0 1px 8px #0004;font-family:Tinos,"Times New Roman","Liberation Serif",Times,serif;zoom:var(--z,1);text-align:left}
.rp{position:absolute;left:28.2mm;top:19mm;width:152.5mm}
.kop{height:31.8mm;position:relative;border-bottom:.55mm solid #000;text-align:center}
.kop img{position:absolute}.kop .tt{position:absolute;left:24mm;width:102.5mm;top:6.2mm;font-weight:bold;font-size:15.45pt;white-space:nowrap}.kop .tt div{height:6.1mm;line-height:6.1mm}
.rt{border-collapse:collapse;width:100%;table-layout:fixed;font-size:11.4pt;margin-top:.5mm}
.rt td{padding:0 1.2mm;height:var(--rh,5.05mm);line-height:1.05;white-space:nowrap;vertical-align:middle}
.rt .bd{border:.25mm solid #000}.kl{border-left:.25mm solid #000}.kr{border-right:.25mm solid #000}.kb{border-bottom:.25mm solid #000}
.b{font-weight:bold}.ctr{text-align:center}.bc{font-weight:bold;text-align:center}.ci{font-style:italic;text-align:center}.ov2{overflow:visible}.red{color:#f00}.dt{font-style:italic;text-align:left}.u{text-decoration:underline}
.cv .ct{position:absolute;left:0;right:0;text-align:center;font-weight:bold}.cv .ct b{display:block;font-size:15.7pt;line-height:7.3mm}
.cv table{position:absolute;left:57mm;top:192mm;width:95.5mm;border:.25mm solid #000;border-collapse:collapse}
.cv td{padding:0 0 0 .1mm;vertical-align:top;font-size:13pt;line-height:5.2mm}.cv td+td+td{font-family:Calibri,Carlito,sans-serif;font-size:12pt}
.cf{position:absolute;left:0;right:0;top:239.5mm;text-align:center;font-size:11.5pt;line-height:4.5mm}.cf b{font-size:15.7pt;display:block;line-height:6.5mm;margin-bottom:1.2mm}
.id{position:absolute;left:10mm;top:41mm;width:190mm;font-size:12pt}
.ir{display:grid;grid-template-columns:7mm 51mm 2.9mm 130mm;min-height:6.47mm;line-height:1.25;padding-top:.6mm}.ir>span:first-child{text-align:right;padding-right:2.9mm}.ir.t{min-height:12.94mm}
@media print{
@page{size:A4;margin:0}
:root{padding:0!important}
html,body{background:#fff!important;padding:0!important}
body>*:not(#sheets){display:none!important}
#sheets{display:block!important;padding:0}
.page{zoom:1!important;margin:0!important;box-shadow:none!important;break-after:page;page-break-after:always}
}

}

 const k=e.key,t=e.target,r=+t.dataset.r,c=+t.dataset.c;let dr=0,dc=0;

 if(el){el.focus();el.select&&el.select();return}
 if(dc&&!t.dataset.g&&typeof mp==="number"){const n=mp+dc;if(n>=0&&n<MP.length){mp=n;R();setTimeout(()=>{const x=document.querySelector(`input[data-r="${r}"]`);if(x){x.focus();x.select()}},0)}}
}

function impor(f){

  const g=W.DataGuru,ds=W.DataSiswa,nl=W.Nilai;if(!g||!ds||!nl)throw 0;

  if(!siswa.length||!guru.kelas)throw 0;

 }catch(e){toast("File tidak sesuai format rapor")}};rd.readAsArrayBuffer(f)
}
